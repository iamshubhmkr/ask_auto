[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askauto"
version = "0.1.0"
description = "Natural-language questions over a 3-table SQLite database."
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (single source of truth).

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
askauto = ["web/*.html"]  # the page served at GET /

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
